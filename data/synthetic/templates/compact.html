<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <style>
      @page {
        size: A4;
        margin: 11mm 12mm;
      }
      body {
        font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif;
        font-size: 8.6pt;
        line-height: 1.32;
        color: #1c1c1c;
        margin: 0;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 2px solid #2b4a3f;
        padding-bottom: 4px;
      }
      h1 {
        font-size: 18pt;
        margin: 0;
        color: #2b4a3f;
      }
      .headline {
        font-size: 10pt;
        color: #444;
      }
      .contact {
        font-size: 8pt;
        color: #555;
        text-align: right;
      }
      h2 {
        font-size: 9pt;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #2b4a3f;
        margin: 9px 0 3px;
        border-bottom: 1px solid #c4cfca;
      }
      p {
        margin: 0 0 3px;
      }
      .job,
      .project,
      .edu {
        margin-bottom: 5px;
        break-inside: avoid-page;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-weight: bold;
      }
      .dates {
        font-weight: normal;
        color: #555;
        white-space: nowrap;
      }
      .sub {
        color: #555;
      }
      ul {
        margin: 2px 0 0;
        padding-left: 14px;
      }
      li {
        margin-bottom: 1px;
      }
      ul.skills {
        list-style: none;
        padding: 0;
        columns: 2;
        column-gap: 16px;
      }
      ul.skills li {
        break-inside: avoid;
      }
      .note {
        font-size: 6pt;
        color: #aaaaaa;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    {{body}}
  </body>
</html>
