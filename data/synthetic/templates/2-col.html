<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <style>
      @page {
        size: A4;
        margin: 0;
      }
      * {
        box-sizing: border-box;
      }
      html {
        /* The sidebar colour must repeat on every printed page. */
        background: linear-gradient(to right, #263445 64mm, #ffffff 64mm);
      }
      body {
        font-family: 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif;
        font-size: 9.6pt;
        line-height: 1.4;
        color: #222;
        margin: 0;
      }
      .page {
        display: flex;
      }
      .side {
        width: 64mm;
        flex: none;
        color: #eef1f4;
        padding: 14mm 8mm;
        overflow-wrap: anywhere;
      }
      .main {
        flex: 1;
        padding: 14mm 10mm;
        min-width: 0;
      }
      .side h2 {
        font-size: 10pt;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid #6b7c90;
        padding-bottom: 2px;
        margin: 15px 0 6px;
      }
      .side h2:first-child {
        margin-top: 0;
      }
      .side ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .side li {
        margin-bottom: 3px;
      }
      .side .small {
        font-size: 8.8pt;
      }
      h1 {
        font-size: 23pt;
        line-height: 1.15;
        margin: 0;
      }
      .headline {
        font-size: 12pt;
        color: #444;
        margin: 3px 0 8px;
      }
      .main h2 {
        font-size: 11pt;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 2px solid #263445;
        padding-bottom: 2px;
        margin: 14px 0 7px;
        color: #263445;
      }
      p {
        margin: 0 0 4px;
      }
      .job,
      .project {
        margin-bottom: 8px;
        break-inside: avoid-page;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-weight: bold;
      }
      .dates {
        font-weight: normal;
        color: #555;
        white-space: nowrap;
      }
      .sub {
        color: #555;
      }
      .main ul {
        margin: 3px 0 0;
        padding-left: 17px;
      }
      .main li {
        margin-bottom: 2px;
      }
      .edu {
        margin-bottom: 6px;
      }
      .side .sub,
      .side .dates {
        color: #b6c3d1;
      }
      .note {
        font-size: 6pt;
        color: #aaaaaa;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    {{body}}
  </body>
</html>
